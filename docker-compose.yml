version: "1.0.0"

name: smart-expense-tracker-stack
services:
  backend:
    build: ./smart-expense-tracker-service
    # restart: always
    ports:
      - 8080:8080

  database:
    image: postgres:15
    # restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
